<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍓 AI แยกชนิดผลไม้สุดคิ้วท์ 🍊</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffeef8 0%, #fff5eb 50%, #f3e8ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #5c4b51;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 450px;
            border-radius: 32px;
            padding: 35px 28px;
            box-shadow: 0 15px 35px rgba(255, 133, 162, 0.18);
            border: 2px solid #ffffff;
            text-align: center;
        }

        h2 {
            color: #ff6b9d;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #9e8a92;
            margin-bottom: 18px;
        }

        #status-badge {
            font-size: 13px;
            background: #fff3cd;
            color: #856404;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 18px;
            border: 1px solid #ffeeba;
        }

        /* พื้นที่ลากวางหรือคลิกเลือกรูปภาพ */
        .drop-zone {
            width: 240px;
            height: 240px;
            margin: 0 auto;
            border-radius: 26px;
            border: 3px dashed #ffb3c6;
            background-color: #fff9fb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
            transition: all 0.25s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background-color: #fff0f5;
            border-color: #ff6b9d;
            transform: scale(1.02);
        }

        #placeholder-box {
            padding: 20px;
            color: #d4899f;
            pointer-events: none;
        }

        #placeholder-box .icon {
            font-size: 42px;
            margin-bottom: 8px;
            display: block;
        }

        #placeholder-box p {
            font-size: 14px;
            font-weight: 500;
        }

        #placeholder-box span {
            font-size: 12px;
            color: #b89aa5;
        }

        #previewImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* ปุ่มกดเลือกรูปด้านล่าง */
        .upload-btn {
            display: inline-block;
            margin-top: 18px;
            background: linear-gradient(45deg, #ff85a2, #ff6b9d);
            color: white;
            padding: 12px 26px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.3);
            transition: all 0.2s ease;
            border: none;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(255, 107, 157, 0.4);
        }

        /* กล่องสรุปผลลัพธ์ */
        #resultSummary {
            display: none;
            margin-top: 22px;
            padding: 15px 18px;
            background: linear-gradient(135deg, #fff0f5, #ffe4ec);
            border: 2px solid #ffb3c6;
            border-radius: 20px;
            color: #d6336c;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(255, 179, 198, 0.25);
        }

        /* รายการเปอร์เซ็นต์แต่ละคลาส */
        #label-container {
            margin-top: 18px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
        }

        .prediction-item {
            background: #fffafb;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid #ffe3ec;
        }

        .prediction-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #6d5960;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background-color: #ffe3ec;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9ebb, #ff6b9d);
            border-radius: 10px;
            width: 0%;
            transition: width 0.4s ease-out;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🍓 AI แยกชนิดผลไม้ 🍊</h2>
        <p class="subtitle">เลือกรูปผลไม้จากในเครื่อง หรือลากรูปมาวางได้เลยค่า~</p>

        <div id="status-badge">⏳ กำลังปลุกน้อง AI...</div>

        <!-- กรอบคลิกหรือลากรูปมาวาง -->
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('imageInput').click()">
            <div id="placeholder-box">
                <span class="icon">🍎</span>
                <p>คลิกหรือลากรูปผลไม้มาวาง</p>
                <span>รองรับไฟล์ JPG, PNG</span>
            </div>
            <img id="previewImage" alt="รูปผลไม้ที่อัปโหลด" />
        </div>

        <!-- input รับไฟล์รูปภาพ (ซ่อนไว้) -->
        <input type="file" id="imageInput" accept="image/*" onchange="processImageFile(this.files[0])">

        <!-- ปุ่มกดเลือกรูปภาพ -->
        <button type="button" class="upload-btn" onclick="document.getElementById('imageInput').click()">
            📸 เลือกรูปจากเครื่อง
        </button>

        <!-- กล่องสรุปผลลัพธ์ -->
        <div id="resultSummary"></div>

        <!-- รายการเปอร์เซ็นต์แต่ละคลาส -->
        <div id="label-container"></div>
    </div>

    <!-- โหลดไลบรารี TensorFlow.js และ Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <script type="text/javascript">
        // เปลี่ยนชื่อตัวแปรเป็น MODEL_PATH เพื่อไม่ให้ชนกับคำสั่ง window.URL ของเบราว์เซอร์!
        const MODEL_PATH = "./my_model/";

        let model, labelContainer, maxPredictions;
        let isModelReady = false;

        // 1. โหลดโมเดลเมื่อเปิดหน้าเว็บ
        async function init() {
            const statusBadge = document.getElementById("status-badge");

            try {
                const modelURL = MODEL_PATH + "model.json";
                const metadataURL = MODEL_PATH + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                isModelReady = true;

                statusBadge.style.background = "#d4edda";
                statusBadge.style.color = "#155724";
                statusBadge.style.borderColor = "#c3e6cb";
                statusBadge.innerHTML = "✨ น้อง AI พร้อมแยกผลไม้แล้วค่า!";

                // สร้างแถบแสดงผลลัพธ์ตามจำนวนคลาสที่มี
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    const itemDiv = document.createElement("div");
                    itemDiv.className = "prediction-item";
                    itemDiv.innerHTML = `
                        <div class="prediction-header">
                            <span class="class-name">ผลไม้ชนิดที่ ${i+1}</span>
                            <span class="class-percent">0%</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill"></div>
                        </div>
                    `;
                    labelContainer.appendChild(itemDiv);
                }
            } catch (error) {
                console.error("Model load error:", error);
                statusBadge.style.background = "#f8d7da";
                statusBadge.style.color = "#721c24";
                statusBadge.style.borderColor = "#f5c6cb";
                statusBadge.innerHTML = "❌ หาโฟลเดอร์ my_model ไม่เจอ (เช็กการรันผ่าน Live Server น้า)";
            }
        }
        
        init();

        // 2. ฟังก์ชันรับไฟล์รูปภาพมาแสดงผลและทำนายผล
        function processImageFile(file) {
            if (!file) return;

            const imageElement = document.getElementById("previewImage");
            const placeholderBox = document.getElementById("placeholder-box");
            const summaryDiv = document.getElementById("resultSummary");

            // ใช้ FileReader อ่านรูปภาพจากเครื่องมาแสดง (เสถียรและไม่ติดปัญหา URL)
            const reader = new FileReader();
            reader.onload = function(e) {
                imageElement.src = e.target.result;
                imageElement.style.display = "block";
                placeholderBox.style.display = "none";
            };
            reader.readAsDataURL(file);

            // เมื่อรูปโหลดแสดงบนหน้าจอเสร็จ ให้ AI วิเคราะห์ทันที
            imageElement.onload = async function() {
                if (!isModelReady) {
                    summaryDiv.style.display = "block";
                    summaryDiv.innerHTML = "⚠️ โมเดลยังโหลดไม่เสร็จ กรุณารอสักครู่แล้วเลือกรูปใหม่นะคะ";
                    return;
                }

                summaryDiv.style.display = "block";
                summaryDiv.innerHTML = "🔍 กำลังสแกนดูว่าผลไม้อะไรน้า...";

                const prediction = await model.predict(imageElement);
                
                let highestProbability = 0;
                let bestClassName = "";

                for (let i = 0; i < maxPredictions; i++) {
                    const prob = prediction[i].probability;
                    const className = prediction[i].className;
                    const percent = (prob * 100).toFixed(1);

                    const itemDiv = labelContainer.childNodes[i];
                    itemDiv.querySelector(".class-name").innerText = className;
                    itemDiv.querySelector(".class-percent").innerText = `${percent}%`;
                    itemDiv.querySelector(".progress-fill").style.width = `${percent}%`;

                    if (prob > highestProbability) {
                        highestProbability = prob;
                        bestClassName = className;
                    }
                }

                summaryDiv.innerHTML = `🎉 สรุปผล: นี่คือ <u>${bestClassName}</u> (${(highestProbability * 100).toFixed(1)}%)`;
            };
        }

        // 3. รองรับการลากไฟล์รูปมาวาง (Drag & Drop)
        const dropZone = document.getElementById("dropZone");

        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            if (e.dataTransfer.files.length > 0) {
                processImageFile(e.dataTransfer.files[0]);
            }
        });
    </script>
</body>
</html>
